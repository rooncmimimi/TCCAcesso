appId: com.acesso.app
name: (subfluxo) Login com conta de teste
---
# Subfluxo usado via `runFlow` pelos outros arquivos desta pasta. Precisa de
# uma conta de teste real (o README.md desta pasta explica por que ela não é
# criada e descartada a cada execução).
- launchApp
- tapOn: "E-mail"
- inputText: "${ACESSO_TEST_EMAIL}"
- tapOn: "Senha"
- inputText: "${ACESSO_TEST_SENHA}"
- tapOn: "Entrar"
- assertVisible: "Página inicial"
