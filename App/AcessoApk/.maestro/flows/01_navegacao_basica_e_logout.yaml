appId: com.acesso.app
name: Login → navega pelas abas principais → Configurações → Sair
tags:
  - smoke
---
# Teste de fumaça: login real, visita às abas principais (rótulos de
# acessibilidade de `navigation/AbasNavigator.tsx`), ida e volta em
# Configurações (Perfil → Configurações, `MenuPerfilScreen.tsx`) e saída pelo
# botão "Sair da conta", que fica direto no menu do Perfil, e não dentro de
# Configurações. Ainda não executado em emulador ou aparelho: ver o README.md
# desta pasta antes de rodar.
- runFlow: 00_login.yaml
- tapOn: "Vagas"
- assertVisible: "Vagas"
- tapOn: "Mensagens"
- assertVisible: "Mensagens"
- tapOn: "Notificações"
- assertVisible: "Notificações"
- tapOn: "Perfil"
- assertVisible: "Meu perfil"
- tapOn: "Configurações"
- assertVisible: "Privacidade"
- back
- assertVisible: "Sair da conta"
- tapOn: "Sair da conta"
- assertVisible: "E-mail"
- assertVisible: "Senha"
