services:
  - type: web
    name: acesso-backend
    runtime: node
    plan: free
    rootDir: Site/Backend
    # As migrations pendentes são aplicadas no build, antes de a versão nova entrar no ar: se
    # falharem, o deploy falha e a versão anterior continua servindo. `npm run migrate` não faz
    # nada quando não há migration pendente.
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_PUBLIC_BUCKET
        value: public-media
      - key: SUPABASE_STORAGE_PRIVATE_BUCKET
        value: private-documents
      - key: MAX_VIDEO_UPLOAD_BYTES
        value: "52428800"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_REMETENTE_EMAIL
        sync: false
      - key: BREVO_REMETENTE_NOME
        value: ACESSO
      # Fale conosco: para onde vão as mensagens do formulário (não há valor padrão).
      - key: CONTATO_EMAIL_DESTINO
        sync: false
      # Entrar com Google (OAuth). Sem as três o botão "Continuar com Google" nem aparece no Site, e se o
      # serviço for recriado a partir deste arquivo ele sumiria sem aviso. Os valores ficam só no painel
      # do Render, nunca aqui. GOOGLE_REDIRECT_URI é https://<este-serviço>.onrender.com/api/auth/google/callback
      # e precisa estar cadastrado, idêntico, em "URIs de redirecionamento autorizados" do cliente OAuth
      # no Google Cloud Console. Para conferir tudo depois de mexer: `npm run google:verificar`.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Etapa 6: "true" cria a conta no retorno do Google, sem senha. Só depois de aplicar a migration
      # 0007 (senha_hash aceitando nulo). Desligada, o cadastro segue o formulário com senha.
      - key: GOOGLE_CONTA_SEM_SENHA
        value: "false"
      # Verificação em duas etapas (TOTP): obrigatória para administradores. Só ligue depois de aplicar a
      # migration 0008 e de definir MFA_CHAVE_CIFRA. Veja Site/docs/verificacao-em-duas-etapas.md.
      - key: MFA_TOTP_HABILITADO
        value: "false"
      # Por enquanto só administrador, e opcional. Para tornar obrigatória: MFA_TOTP_OBRIGATORIO_ADMIN=true.
      - key: MFA_TOTP_TIPOS
        value: administrador
      - key: MFA_TOTP_OBRIGATORIO_ADMIN
        value: "false"
      # Sessões e dispositivos (Bloco 2). Só ligue depois de aplicar a migration 0009.
      - key: SESSOES_DISPOSITIVOS_HABILITADO
        value: "false"
      - key: SESSOES_MAXIMO_POR_CONTA
        value: "20"
      - key: MFA_CHAVE_CIFRA
        sync: false
