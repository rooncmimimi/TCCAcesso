plugins {
    id 'com.android.application'
}

// As credenciais do Supabase ficam no local.properties (fora do Git)
// e chegam ao código Java pela classe BuildConfig.
Properties propriedadesLocais = new Properties()
File arquivoPropriedadesLocais = rootProject.file('local.properties')
if (arquivoPropriedadesLocais.exists()) {
    arquivoPropriedadesLocais.withInputStream { propriedadesLocais.load(it) }
}

// Lê primeiro da linha de comando (-PNOME=valor) e depois do local.properties.
def configuracao = { String nome, String padrao ->
    def valor = (project.findProperty(nome) ?: propriedadesLocais.getProperty(nome, padrao)).toString().trim()
    valor.isEmpty() ? padrao : valor  // linha em branco no local.properties conta como "não definido"
}

// De onde vem o login: "api" (padrão: API Express do Site, Site/Backend, publicada no Render),
// "supabase" (login direto pelo Supabase Auth, exige URL_SUPABASE e CHAVE_ANONIMA_SUPABASE) ou
// "simulada" (respostas falsas, só no build de debug, para testar a navegação sem servidor).
// Veja docs/PLANEJAMENTO_BACKEND.md.
def fonteAutenticacao = configuracao('FONTE_AUTENTICACAO', 'api')
if (!['supabase', 'api', 'simulada'].contains(fonteAutenticacao)) {
    throw new GradleException("FONTE_AUTENTICACAO inválida: '${fonteAutenticacao}'. Use supabase, api ou simulada.")
}

android {
    namespace 'com.acesso.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.acesso.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'

        buildConfigField 'String', 'URL_SUPABASE', "\"${propriedadesLocais.getProperty('URL_SUPABASE', '')}\""
        buildConfigField 'String', 'CHAVE_ANONIMA_SUPABASE', "\"${propriedadesLocais.getProperty('CHAVE_ANONIMA_SUPABASE', '')}\""
        buildConfigField 'String', 'FONTE_AUTENTICACAO', "\"${fonteAutenticacao}\""
        // Endereço base da API do Site, terminando em /api. O padrão é a API publicada no Render (HTTPS);
        // para uma API local no emulador, use URL_API=http://10.0.2.2:3000/api. Não é segredo.
        buildConfigField 'String', 'URL_API', "\"${configuracao('URL_API', 'https://acesso-backend.onrender.com/api')}\""

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'

    // Comunicação HTTP com a API do Supabase e leitura do JSON
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'junit:junit:4.13.2'
}
