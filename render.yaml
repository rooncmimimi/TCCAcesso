services:
  - type: web
    name: acesso-backend
    runtime: node
    plan: free
    rootDir: Site/Backend
    # As migrations pendentes são aplicadas no build, antes de a versão nova entrar no ar: se
    # falharem, o deploy falha e a versão anterior continua servindo. `npm run migrate` não faz
    # nada quando não há migration pendente.
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_PUBLIC_BUCKET
        value: public-media
      - key: SUPABASE_STORAGE_PRIVATE_BUCKET
        value: private-documents
      - key: MAX_VIDEO_UPLOAD_BYTES
        value: "52428800"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_REMETENTE_EMAIL
        sync: false
      - key: BREVO_REMETENTE_NOME
        value: ACESSO
