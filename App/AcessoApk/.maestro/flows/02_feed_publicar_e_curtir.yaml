appId: com.acesso.app
name: Login → publica um texto no feed → curte → exclui a própria publicação
tags:
  - smoke
---
# Cria a própria publicação, em vez de depender de o feed já ter conteúdo (uma
# conta de teste nova costuma estar vazia), e a exclui no final pela ação
# "Excluir publicação" da tela: um fluxo de interface não consegue limpar
# resíduos direto no banco, então a limpeza não pode depender de ninguém.
# Rótulos de `FeedScreen.tsx`, `NovaPostagemScreen.tsx` e
# `DetalhePostagemScreen.tsx`. Ainda não executado em emulador ou aparelho:
# ver o README.md desta pasta.
- runFlow: 00_login.yaml
- tapOn: "Criar nova publicação"
- tapOn: "Texto da publicação"
- inputText: "Publicação de teste automatizado (Maestro) — pode ignorar."
- tapOn: "Publicar"
- assertVisible: "Publicação de teste automatizado (Maestro) — pode ignorar."
- tapOn: "Curtir"
- assertVisible: "Descurtir"
- tapOn: "Publicação de teste automatizado (Maestro) — pode ignorar."
- tapOn: "Excluir publicação"
- tapOn: "Excluir"
- assertNotVisible: "Publicação de teste automatizado (Maestro) — pode ignorar."
